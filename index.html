<!doctype html>
<html lang="pl">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#2563eb">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">

<title>Bufet – Obiady</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:28px 15px 30px;
}

header h1{
  margin:0;
  font-size:32px;
  font-weight:800;
}

header div{
  margin-top:8px;
  font-size:18px;
}

main{
  max-width:900px;
  margin:auto;
  padding:20px 16px 30px;
}

.date-title{
  background:#eaf2ff;
  border:3px solid #b9d4ff;
  border-radius:20px;
  padding:17px;
  text-align:center;
  font-size:27px;
  font-weight:800;
  color:#101b52;
  margin-bottom:20px;
}

.section{
  background:white;
  border-radius:18px;
  margin-bottom:20px;
  overflow:hidden;
  box-shadow:0 2px 10px #0001;
}

.section-title{
  background:#2563eb;
  color:white;
  padding:15px 22px;
  font-size:28px;
  font-weight:800;
}

.item{
  margin:0 20px;
  padding:17px 4px;
  border-bottom:2px solid #e8edf5;
  font-size:22px;
  font-weight:600;
}

.item:last-child{
  border-bottom:0;
}

.loading{
  background:white;
  border-radius:18px;
  padding:30px;
  text-align:center;
  color:#64748b;
  font-size:18px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:20px;
  border-radius:15px;
  line-height:1.5;
}

.empty{
  background:white;
  border-radius:18px;
  padding:30px;
  text-align:center;
  color:#64748b;
  font-size:18px;
}

.price-box{
  background:#eaf2ff;
  border:3px solid #c7ddff;
  border-radius:18px;
  padding:18px 12px;
  margin-top:28px;
}

.price-title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  color:#101b52;
  margin-bottom:18px;
}

.prices{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
}

.price-column{
  text-align:center;
  padding:5px 10px;
  border-right:1px solid #9cc4ff;
}

.price-column:last-child{
  border-right:0;
}

.price-name{
  font-size:19px;
  font-weight:700;
  color:#111827;
}

.price{
  margin-top:8px;
  color:#2563eb;
  font-size:30px;
  font-weight:800;
}

.refresh{
  width:100%;
  border:0;
  border-radius:12px;
  background:#64748b;
  color:white;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  margin-top:15px;
}

.updated{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin-top:12px;
}

@media(max-width:600px){

  header h1{
    font-size:30px;
  }

  .date-title{
    font-size:23px;
  }

  .section-title{
    font-size:24px;
  }

  .item{
    font-size:20px;
  }

  .price-name{
    font-size:16px;
  }

  .price{
    font-size:25px;
  }

}

</style>

</head>

<body>

<header>

<h1>🍽️ Bufet – Obiady</h1>

<div>Menu obiadowe</div>

</header>


<main>

<div id="menu">

<div class="loading">
⏳ Ładowanie menu…
</div>

</div>


<button
class="refresh"
onclick="loadMenu()">

🔄 Odśwież menu

</button>


<div
id="updated"
class="updated">
</div>

</main>


<script>

const SHEET_ID =
"10Dy8W1sR-aZ74gVAgTevIjX28O4VQiD9nIGHz9xF1mM";


async function loadMenu(){

const menu =
document.getElementById("menu");

const updated =
document.getElementById("updated");

menu.innerHTML =
'<div class="loading">⏳ Ładowanie menu…</div>';


try{

const url =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json";


const response =
await fetch(
url + "&cache=" + Date.now()
);


if(!response.ok){

throw new Error(
"Nie udało się połączyć z arkuszem."
);

}


const text =
await response.text();


const match =
text.match(
/google\.visualization\.Query\.setResponse\(([\s\S]+)\);/
);


if(!match){

throw new Error(
"Nie udało się odczytać danych z arkusza."
);

}


const data =
JSON.parse(match[1]);


if(
!data.table ||
!data.table.rows
){

throw new Error(
"Arkusz nie zawiera danych."
);

}


const rows =
data.table.rows;


const meals = [];

let lastType = "";


rows.forEach(function(row){

const cells =
row.c || [];


function value(index){

if(
!cells[index] ||
cells[index].v === null ||
cells[index].v === undefined
){

return "";

}

if(
cells[index].f !== undefined &&
cells[index].f !== null
){

return String(cells[index].f).trim();

}

return String(cells[index].v).trim();

}


const date =
value(0);

let type =
value(1);

const dish =
value(2);


/*
Jeżeli w arkuszu zostawisz pustą
kategorię w kolejnych wierszach,
program automatycznie użyje poprzedniej.
*/

if(type !== ""){

lastType = type;

}else{

type = lastType;

}


if(date && type && dish){

meals.push({

date:date,
type:type,
dish:dish

});

}

});


if(meals.length === 0){

menu.innerHTML =
'<div class="empty">' +
'🍽️ Brak pozycji w menu.' +
'</div>';

return;

}


/*
Bierzemy pierwszą datę znajdującą się
w arkuszu.
*/

const currentDate =
meals[0].date;


const todayMeals =
meals.filter(function(meal){

return meal.date === currentDate;

});


const soups =
todayMeals.filter(function(meal){

return meal.type
.toLowerCase()
.includes("zup");

});


const mains =
todayMeals.filter(function(meal){

return meal.type
.toLowerCase()
.includes("ii");

});


const additions =
todayMeals.filter(function(meal){

return meal.type
.toLowerCase()
.includes("dod");

});


let html = "";


/* DATA */

html +=
'<div class="date-title">' +
'📅 Dzisiaj – ' +
escapeHtml(formatDate(currentDate)) +
'</div>';


/* ZUPY */

if(soups.length > 0){

html +=
'<section class="section">' +

'<div class="section-title">' +
'🍲 ZUPY' +
'</div>';

soups.forEach(function(meal){

html +=
'<div class="item">' +
'🥣 ' +
escapeHtml(meal.dish) +
'</div>';

});

html += '</section>';

}


/* II DANIA */

if(mains.length > 0){

html +=
'<section class="section">' +

'<div class="section-title">' +
'🍗 II DANIA' +
'</div>';

mains.forEach(function(meal){

html +=
'<div class="item">' +
'🍗 ' +
escapeHtml(meal.dish) +
'</div>';

});

html += '</section>';

}


/* DODATKI */

if(additions.length > 0){

html +=
'<section class="section">' +

'<div class="section-title">' +
'🥗 DODATKI' +
'</div>';

additions.forEach(function(meal){

html +=
'<div class="item">' +
'🥗 ' +
escapeHtml(meal.dish) +
'</div>';

});

html += '</section>';

}


/* CENNIK */

html +=

'<section class="price-box">' +

'<div class="price-title">' +
'💰 CENNIK' +
'</div>' +

'<div class="prices">' +

'<div class="price-column">' +
'<div class="price-name">🥣 Zupa</div>' +
'<div class="price">9 zł</div>' +
'</div>' +

'<div class="price-column">' +
'<div class="price-name">🍗 II danie</div>' +
'<div class="price">22 zł</div>' +
'</div>' +

'<div class="price-column">' +
'<div class="price-name">🍽️ Zestaw</div>' +
'<div class="price">27 zł</div>' +
'</div>' +

'</div>' +

'</section>';


menu.innerHTML =
html;


const now =
new Date();


updated.textContent =
"Ostatnia aktualizacja: " +
now.toLocaleTimeString(
"pl-PL",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

catch(error){

console.error(error);

menu.innerHTML =

'<div class="error">' +

'<b>❌ Nie udało się wczytać menu.</b>' +

'<br><br>' +

escapeHtml(error.message) +

'</div>';

}

}


/*
Formatowanie daty.
Obsługuje m.in.:
10
10 września
09.09.2026
*/

function formatDate(value){

const text =
String(value).trim();


const months = [

"stycznia",
"lutego",
"marca",
"kwietnia",
"maja",
"czerwca",
"lipca",
"sierpnia",
"września",
"października",
"listopada",
"grudnia"

];


if(/^\d{1,2}$/.test(text)){

const day =
parseInt(text,10);

const month =
new Date().getMonth();

return day + " " + months[month];

}


return text;

}


function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* START */

loadMenu();


/* AUTOMATYCZNE ODŚWIEŻANIE */

setInterval(
loadMenu,
60000
);

</script>

</body>

</html>
