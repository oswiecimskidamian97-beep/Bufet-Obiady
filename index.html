<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Bufet – Obiady</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}
header{background:#2563eb;color:white;padding:18px;text-align:center}
main{max-width:900px;margin:auto;padding:16px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ccd3df;font-size:16px}
button{background:#2563eb;color:white;border:0;font-weight:bold}
.secondary{background:#64748b}.danger{background:#dc2626}
img{max-width:100%;border-radius:10px}.price{font-size:20px;font-weight:bold}
.muted{color:#64748b}#admin{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🍽️ Bufet – Obiady</h1><div>Menu</div></header>
<main>
<section id="menu"><p class="muted">Ładowanie menu…</p></section>
<section class="card"><button class="secondary" onclick="showLogin()">Panel administratora</button></section>
<section id="login" class="card" style="display:none">
<h2>Logowanie administratora</h2>
<input id="email" type="email" placeholder="E-mail">
<input id="password" type="password" placeholder="Hasło">
<button onclick="login()">Zaloguj</button>
<button class="secondary" onclick="hideLogin()">Anuluj</button>
<p id="loginMsg"></p>
</section>
<section id="admin" class="card">
<h2>Panel administratora</h2>
<button class="secondary" onclick="logout()">Wyloguj</button><hr>
<h3>Dodaj obiad</h3>
<div class="row"><input id="date" type="date"><input id="name" placeholder="Nazwa obiadu"></div>
<div class="row"><input id="price" type="number" step="0.01" placeholder="Cena (zł)"><input id="image" placeholder="Adres zdjęcia (opcjonalnie)"></div>
<textarea id="description" placeholder="Opis"></textarea>
<input id="allergens" placeholder="Alergeny, np. gluten, mleko">
<button onclick="addMeal()">Dodaj obiad</button><p id="adminMsg"></p>
<div id="adminMeals"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
 const SUPABASE_URL="https://xclaiclubwkthyfpdbvo.supabase.co";
const SUPABASE_KEY=sb_publishable_Ro3KCGc7qqQrvlBPBD3tPw_H1HomM3E
const ready=!SUPABASE_URL.includes("WSTAW_TUTAJ")&&!SUPABASE_KEY.includes("WSTAW_TUTAJ");
const db=ready?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
function showLogin(){document.getElementById("login").style.display="block"}
function hideLogin(){document.getElementById("login").style.display="none"}
function money(v){return Number(v).toFixed(2).replace(".",",")+" zł"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]))}
async function loadMeals(){
 const el=document.getElementById("menu");
 if(!ready){el.innerHTML='<div class="card"><b>Aplikacja jest jeszcze w trakcie konfiguracji.</b></div>';return}
 const {data,error}=await db.from("meals").select("*").order("meal_date",{ascending:true});
 if(error){el.innerHTML='<div class="card">Błąd: '+esc(error.message)+"</div>";return}
 if(!data.length){el.innerHTML='<div class="card">Brak dodanych obiadów.</div>';return}
 el.innerHTML=data.map(m=>'<article class="card">'+(m.image_url?'<img src="'+esc(m.image_url)+'">':"")+
 '<h2>'+esc(m.name)+'</h2><div class="price">'+money(m.price)+'</div><p><b>Data:</b> '+esc(m.meal_date)+'</p>'+
 (m.description?"<p>"+esc(m.description)+"</p>":"")+(m.allergens?"<p><b>Alergeny:</b> "+esc(m.allergens)+"</p>":"")+
 "</article>").join("")
}
async function login(){
 if(!ready)return;
 const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});
 document.getElementById("loginMsg").textContent=error?error.message:"Zalogowano.";
 if(!error){hideLogin();document.getElementById("admin").style.display="block";loadAdmin()}
}
async function logout(){await db.auth.signOut();document.getElementById("admin").style.display="none"}
async function addMeal(){
 const {error}=await db.from("meals").insert({
 meal_date:document.getElementById("date").value,name:document.getElementById("name").value,
 price:Number(document.getElementById("price").value),description:document.getElementById("description").value,
 allergens:document.getElementById("allergens").value,image_url:document.getElementById("image").value});
 document.getElementById("adminMsg").textContent=error?error.message:"Dodano obiad!";
 if(!error){loadMeals();loadAdmin()}
}
async function loadAdmin(){
 const {data,error}=await db.from("meals").select("*").order("meal_date",{ascending:false});
 const el=document.getElementById("adminMeals");
 if(error){el.textContent=error.message;return}
 el.innerHTML=data.map(m=>'<div class="card"><b>'+esc(m.meal_date)+" – "+esc(m.name)+
 '</b><button class="danger" onclick="deleteMeal('+m.id+')">Usuń</button></div>').join("")
}
async function deleteMeal(id){
 if(!confirm("Usunąć ten obiad?"))return;
 const {error}=await db.from("meals").delete().eq("id",id);
 if(error)alert(error.message);else{loadMeals();loadAdmin()}
}
loadMeals();
</script>
</body>
</html>
